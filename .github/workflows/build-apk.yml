name: Build & Release Vexotun APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.3.13750724

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Go tunnel core (arm64 + armv7 stripped)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          mkdir -p app/libs
          cd core
          gomobile bind -target=android/arm64,android/arm -androidapi=24 -ldflags="-s -w" -o ../app/libs/tunelcore.aar .

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/vexotun-release.jks

      - name: Build Signed Release APKs (32-bit & 64-bit)
        env:
          VEXOTUN_KEYSTORE_PATH: /tmp/vexotun-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/*arm64-v8a*.apk release-apks/vexotun-arm64-v8a.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk release-apks/vexotun-armeabi-v7a.apk
          ls -lh release-apks/

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexotun-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-apks/*.apk \
            --title "Vexotun ${GITHUB_REF_NAME}" \
            --notes "Release APK 64-bit (arm64-v8a) & 32-bit (armeabi-v7a), signed with consistent release keystore." \
            --clobber || gh release upload "${GITHUB_REF_NAME}" release-apks/*.apk --clobber
